<div id="accordion-arrow-icon" data-accordion="open" class="bg-white mt-4 rounded-lg">
  <h2 id="accordion-arrow-icon-heading-3">
    <button
      type="button"
      (click)="toggleFilter()"
      class="flex items-center justify-between w-full p-5 font-medium rtl:text-right text-gray-500 rounded-t-lg border border-gray-200 dark:border-gray-700 dark:text-gray-400 gap-3"
      data-accordion-target="#accordion-arrow-icon-body-3"
      aria-expanded="false"
      aria-controls="accordion-arrow-icon-body-3"
    >
      <div class="flex">
        <i-feather name="filter" class="text-gray-600 text-lg mr-2"></i-feather>
        <h4 style="margin-left: 10px; margin-bottom: 0px">Filtrar</h4>
      </div>
      <svg
        data-accordion-icon
        class="w-3 h-3 rotate-180 shrink-0"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 10 6"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 5 5 1 1 5"
        />
      </svg>
    </button>
  </h2>
  <div
    id="accordion-arrow-icon-body-3"
    class="hidden"
    aria-labelledby="accordion-arrow-icon-heading-3"
  >
    <div class="mt-3 pb-4 px-4 grid grid-cols-5 gap-4 items-end">
      <div class="">
        <div class="form-group">
          <label for="batch-number" class="block mb-2 text-sm font-medium dark:text-white"
            >Cod/Número de lote</label
          >
          <input
            [(ngModel)]="batchCode"
            autocomplete="off"
            type="text"
            id="batch-number"
            placeholder="Ingrese cod/número de lote"
            class="bg-gray-50 border border-gray-300 text-gray-900 h-10 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          />
        </div>
      </div>
      <div class="form-group">
        <label for="state" class="block mb-2 text-sm font-medium dark:text-white">Estado</label>
        <select
          id="state"
          (change)="onStatusSelect($event)"
          class="bg-gray-50 border border-gray-300 text-gray-900 h-10 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        >
          <option selected>Selecciona una opción</option>
          @for (status of statusList; track $index) {
            <option value="{{ status }}">{{ status }}</option>
          }
        </select>
      </div>

      <div class="col-span-2 form-group">
        <div id="date-range-picker" class="flex items-center">
          <div class="flex flex-col">
            <label class="block mb-2 text-sm font-medium dark:text-white" for="ExampleDatepicker"
              >Fecha desde
            </label>
            <div class="relative mr-4">
              <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                <i-feather name="calendar" class="text-gray-600 text-sm mr-2 !w-4 !h-4"></i-feather>
              </div>
              <input
                id="datepicker-range-start"
                datepicker
                name="start"
                (selectionchange)="changeStartDate()"
                (change)="changeInputStartDate($event)"
                [ngClass]="errorDate() && errorDateStart ? 'border-red-600' : ' border-gray-300'"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full h-10 ps-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                placeholder="dd/mm/aaaa"
              />
            </div>
          </div>
          <div class="flex flex-col">
            <label class="block mb-2 text-sm font-medium dark:text-white" for="ExampleDatepicker"
              >Fecha hasta</label
            >
            <div class="relative">
              <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                <i-feather name="calendar" class="text-gray-600 text-sm mr-2 !w-4 !h-4"></i-feather>
              </div>
              <input
                id="datepicker-range-end"
                datepicker
                name="end"
                type="text"
                (selectionchange)="changeEndDate()"
                (change)="changeInputEndDate($event)"
                [ngClass]="errorDate() && errorDateEnd ? 'border-red-600' : ' border-gray-300'"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full h-10 ps-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                placeholder="dd/mm/aaaa"
              />
            </div>
          </div>
        </div>
      </div>
      <div class="filters__footer flex justify-end gap-4">
        <button type="button" class="btn btn-sm bg-outline-primary p-2" (click)="clearFilters()">
          Limpiar
        </button>
        <button
          type="button"
          class="flex items-center bg-primary dark:bg-primary_dark !text-white hover:bg-opacity-75 hover:text-white hover:border-transparent focus:outline-none focus:ring-4 focus:ring-blue-300 font-semibold rounded-full text-base px-5 py-2 text-center m-0 [font-smoothing:_antialiased] [-webkit-font-smoothing:_antialiased]"
          (click)="applyFilters()"
        >
          Aplicar
        </button>
      </div>
    </div>
    @if (errorDate()) {
      <p class="pb-2 px-4 text-sm !text-red-600 dark:text-red-500">
        {{ messsajeErrorDate }}
      </p>
    }
  </div>
</div>
